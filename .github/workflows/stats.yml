
name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Negin-ozn
          BRANCH_NAME: stats
          TIME_ZONE: Australia/Perth
          AUTO_PUSH: true
          THEME: radical
          ANIMATION: rise
          DURATION: "2.5"
